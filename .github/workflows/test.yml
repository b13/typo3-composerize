name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          php-version: "8.2"
          tools: composer

      - name: Validate composer.json
        run: composer validate --no-check-lock

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-lint-php8.2-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-lint-php8.2-

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress Classes/ Tests/Unit

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix -v --dry-run --diff --using-cache false

  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
    steps:
    - uses: actions/checkout@v4

    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        coverage: "none"
        extensions: "intl, zip"
        ini-values: "memory_limit=-1, phar.readonly=0"
        php-version: "${{ matrix.php-version }}"
        tools: composer

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress

    - name: PHPUnit
      run: vendor/bin/phpunit --log-junit phpunit-report.xml
